name: Release

# Builds JoeBrowserSetup.exe (installer) and JoeBrowser.exe (portable) on a real Windows
# runner, verifies them, and attaches both to a GitHub release.
#
# This file is the single source of truth. It must be installed at
# .github/workflows/release.yml for GitHub to run it; a copy kept anywhere else is inert.
#
# Triggers:
#   push a tag v*        -> build, verify, publish
#   Run workflow (manual)-> build, verify, publish under the tag you type in
#   (an empty manual tag builds and verifies only, publishing nothing)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v2.0.0. Leave empty to build without publishing.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Read the version from package.json
        id: ver
        shell: pwsh
        run: |
          # package.json is the only place the version lives. The asset names, the release
          # title and the tag are all derived from it, so they cannot disagree.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "package.json has no usable version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Check the requested tag against the version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        shell: pwsh
        run: |
          # A release titled v2.1.0 whose binaries report 2.0.0 is a download that lies about
          # itself. Refuse rather than publish that.
          $requested = '${{ github.event.inputs.tag }}'
          $expected = '${{ steps.ver.outputs.tag }}'
          if ($requested -ne $expected) {
            throw "You asked for $requested but package.json says $expected. Bump the version first, or use $expected."
          }
          Write-Host "Tag $requested matches the packaged version."

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and interface tests
        run: npm test

      - name: Build the bundles
        run: npm run build

      - name: Package the Windows binaries
        # --publish never: this step only produces files. Publishing is a separate later step,
        # so a release can never exist for a build that failed after packaging.
        run: npx electron-builder --win --x64 --publish never

      - name: Verify the binaries
        shell: pwsh
        run: |
          $setup = 'release\JoeBrowserSetup.exe'
          $portable = 'release\JoeBrowser.exe'

          foreach ($file in @($setup, $portable)) {
            if (-not (Test-Path $file)) { throw "Missing $file - the packaging step did not produce it" }
            $size = (Get-Item $file).Length
            if ($size -lt 20MB) { throw "$file is only $([math]::Round($size/1MB,1)) MB, which is too small to be a real build" }
            Write-Host "$file - $([math]::Round($size/1MB,1)) MB"
          }

          # Both targets are unsigned; this only reports what the file claims about itself.
          # A missing resource is a warning, never a reason to withhold a working build.
          $info = (Get-Item $setup).VersionInfo
          Write-Host "Installer resource: name '$($info.ProductName)', version '$($info.ProductVersion)'"
          if ([string]::IsNullOrWhiteSpace($info.ProductName) -and [string]::IsNullOrWhiteSpace($info.FileDescription)) {
            Write-Warning 'The installer carries no version resource; Windows will show an unknown publisher.'
          }

      - name: Keep the binaries as a build artifact
        # Always uploaded, even when publishing is skipped, so a failed publish never means a
        # wasted build - the EXE can still be attached by hand from here.
        uses: actions/upload-artifact@v4
        with:
          name: joe-browser-${{ steps.ver.outputs.version }}
          path: |
            release/JoeBrowserSetup.exe
            release/JoeBrowser.exe
          retention-days: 30

      - name: Publish the release
        # A tag push, or a manual run that named a tag. A plain branch push stops before this
        # step, so a broken build stays visible without publishing anything.
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # Fixed asset names, so the README's
          # ../../releases/latest/download/JoeBrowserSetup.exe link never changes shape.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Joe Browser ${{ steps.ver.outputs.version }}
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            **Joe Browser ${{ steps.ver.outputs.version }}**

            Download **JoeBrowserSetup.exe** for the installer, or **JoeBrowser.exe** to run it
            without installing anything.

            Windows 10 or 11, 64-bit. The installer is per user: no administrator prompt and
            nothing written outside your own profile.

            The binaries are not code-signed, so Windows SmartScreen may show
            "Windows protected your PC" the first time. Choose **More info**, then
            **Run anyway**.
          files: |
            release/JoeBrowserSetup.exe
            release/JoeBrowser.exe
