name: Release

# Builds JoeBrowserSetup.exe and JoeBrowser.exe on a real Windows runner and publishes them.
#
# The app is Electron, so the binaries have to come from a Windows-capable toolchain:
# electron-builder unpacks the Windows Electron distribution, stamps the version resources and
# packs the NSIS installer. That cannot be done from a Linux container, which is why this
# workflow exists rather than a build on the developer's machine.
#
# How it is triggered, and what each path does:
#
#   push to a branch      -> build, verify, keep the binaries as a workflow artifact, publish nothing
#   push a tag (v*)       -> build, verify, publish a release with both binaries
#   Run workflow (manual) -> build, verify, and publish a release under the tag you type in
#
# The manual path exists so a release needs one click rather than a local git tag.

on:
  push:
    branches: [main, master, 'arena/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v2.0.0. Leave empty to build only.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Read the version from package.json
        id: ver
        shell: pwsh
        run: |
          # package.json is the only place the version is allowed to live; the asset names, the
          # release title and the tag are all derived from it, so they cannot disagree.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "package.json has no usable version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Check the requested tag against the version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        shell: pwsh
        run: |
          # A release titled v2.1.0 whose binaries report 2.0.0 is worse than no release: it is a
          # download that lies about itself. Refuse rather than publish that.
          $requested = '${{ github.event.inputs.tag }}'
          $expected = '${{ steps.ver.outputs.tag }}'
          if ($requested -ne $expected) {
            throw "You asked for $requested but package.json says $expected. Bump the version first, or use $expected."
          }
          Write-Host "Tag $requested matches the packaged version."

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and interface tests
        run: npm test

      - name: Build the bundles
        run: npm run build

      - name: Package the Windows binaries
        # --publish never: this step only produces files. Publishing is a later step, so a
        # release cannot exist for a build that failed after packaging.
        run: npx electron-builder --win --x64 --publish never

      - name: Verify the binaries
        shell: pwsh
        run: |
          $setup = 'release\JoeBrowserSetup.exe'
          $portable = 'release\JoeBrowser.exe'

          foreach ($file in @($setup, $portable)) {
            if (-not (Test-Path $file)) { throw "Missing $file - the packaging step did not produce it" }
            $size = (Get-Item $file).Length
            if ($size -lt 20MB) { throw "$file is only $([math]::Round($size/1MB,1)) MB, which is too small to be a real build" }
            Write-Host "$file - $([math]::Round($size/1MB,1)) MB"
          }

          # An unsigned installer is expected; the file must still carry a Windows version
          # resource or SmartScreen reports a nameless publisher.
          $info = (Get-Item $setup).VersionInfo
          Write-Host "Product: $($info.ProductName), version $($info.ProductVersion)"
          if ([string]::IsNullOrWhiteSpace($info.ProductName)) {
            throw 'The installer has no product name resource'
          }

      - name: Keep the binaries as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: joe-browser-${{ steps.ver.outputs.version }}
          path: |
            release/JoeBrowserSetup.exe
            release/JoeBrowser.exe
          retention-days: 30

      - name: Publish the release
        # Three ways in, one result: a tag push, or a manual run that named a tag. A branch push
        # stops before this step, so a broken build is visible before anything is published.
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # The asset names are fixed, so the README's
          # ../../releases/latest/download/JoeBrowserSetup.exe link never changes shape.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Joe Browser ${{ steps.ver.outputs.version }}
          draft: false
          generate_release_notes: true
          body: |
            **Joe Browser ${{ steps.ver.outputs.version }}**

            Download **JoeBrowserSetup.exe** for the installer, or **JoeBrowser.exe** to run it
            without installing anything.

            Windows 10 or 11, 64-bit. The installer is per user: no administrator prompt and
            nothing written outside your own profile.

            The binaries are not code-signed, so Windows SmartScreen may show
            "Windows protected your PC" the first time. Choose **More info**, then
            **Run anyway**.
          files: |
            release/JoeBrowserSetup.exe
            release/JoeBrowser.exe
