name: Build EXE

# Minimal release pipeline. Create this file at exactly
#   .github/workflows/release.yml
# (no ci/ prefix), then: Actions -> Build EXE -> Run workflow.
#
# ci/release.yml is the fuller version with verification steps; this file exists because a
# short file is easier to create correctly in the browser, which is where the last attempt
# went wrong.

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Joe Browser 2.0.0
          generate_release_notes: true
          files: |
            release/JoeBrowserSetup.exe
            release/JoeBrowser.exe
