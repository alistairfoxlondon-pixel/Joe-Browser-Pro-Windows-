<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Joe Browser - local-first anti-detect browser workspace for Windows." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="./logo-256.png" />
    <title>Joe Browser</title>
    <script>
      // The theme is applied before first paint: the stored choice wins, so a reopened app never
      // flashes the wrong scheme and never paints an unstyled layout.
      (function () {
        try {
          var theme = localStorage.getItem('joe-theme');
          if (theme !== 'light' && theme !== 'dark') theme = 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.background = theme === 'light' ? '#f6f7fa' : '#0e1014';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.background = '#0e1014';
        }
      })();
    </script>
    <style>
      html { background: #0e1014; }
      html[data-theme='light'] { background: #f6f7fa; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
